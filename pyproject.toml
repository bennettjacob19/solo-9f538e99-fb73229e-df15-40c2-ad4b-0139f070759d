[project]
name = "node-drain-console"
version = "0.1.0"
description = "Node drain console for Kubernetes maintenance windows"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "kubernetes==37.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
